<div class="container m-b-20" fxLayout="row" fxLayout.lt-md="column" fxLayoutAlign="end" fxLayoutGap="2%">
  <button mat-raised-button color="primary" [routerLink]="['edit']" *mifosxHasPermission="'UPDATE_MAXIMUM_CREDIT_RATE'">
    <fa-icon icon="edit" class="m-r-10"></fa-icon>
    {{'labels.buttons.Create' | translate}}
  </button>
</div>
 <div class="container">

    <div fxLayout="row">
      <mat-form-field fxFlex>
        <mat-label>{{'labels.inputs.Filter' | translate}}</mat-label>
        <input matInput (keyup)="applyFilter($event.target.value)">
      </mat-form-field>
    </div>

    <div class="mat-elevation-z8">

      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="productType">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>  {{'labels.inputs.Product Type' | translate }} </th>
          <td mat-cell *matCellDef="let rate"> {{ rate.productType.name }} </td>
        </ng-container>

        <ng-container matColumnDef="appliedOnDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{'labels.inputs.Applied On Date' | translate }} </th>
          <td mat-cell *matCellDef="let rate"> {{ rate.appliedOnDate | dateFormat}} </td>
        </ng-container>

        <ng-container matColumnDef="maxRate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>  {{'labels.inputs.EA Rate' | translate }}</th>
          <td mat-cell *matCellDef="let rate"> {{ rate.eaRate | formatNumber:[2]}}% </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [routerLink]="['edit',row.productType.id]" class="select-row"></tr>

      </table>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>

    </div>

  </div>
